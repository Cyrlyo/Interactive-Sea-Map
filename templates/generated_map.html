                    position: relative;

</head>
<body>
    
    
            <div class="folium-map" id="map_e5e73d9d3847174157147452626b1ab7" ></div>
        
</body>
<script>
    
    
            var map_e5e73d9d3847174157147452626b1ab7 = L.map(
                "map_e5e73d9d3847174157147452626b1ab7",
                {
                    center: [47.8722, -3.9216],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": 13,
  "zoomControl": true,
  "preferCanvas": false,
}

                }
            );

            

        
    
            var tile_layer_06b4acf14b01955841ffef023754dbfb = L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
  "minZoom": 0,
  "maxZoom": 19,
  "maxNativeZoom": 19,
  "noWrap": false,
  "attribution": "\u0026copy; \u003ca href=\"https://www.openstreetmap.org/copyright\"\u003eOpenStreetMap\u003c/a\u003e contributors",
  "subdomains": "abc",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_06b4acf14b01955841ffef023754dbfb.addTo(map_e5e73d9d3847174157147452626b1ab7);
        
    
            var tile_layer_a9496f097e59ffccce821a237c15cf46 = L.tileLayer(
                "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
                {
  "minZoom": 0,
  "maxZoom": 18,
  "maxNativeZoom": 18,
  "noWrap": false,
  "attribution": "Map data: \u00a9 OpenSeaMap contributors",
  "subdomains": "abc",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_a9496f097e59ffccce821a237c15cf46.addTo(map_e5e73d9d3847174157147452626b1ab7);
        
    
            var layer_control_edfb7d855a0e1b0fe6b3b5dedc2d284a_layers = {
                base_layers : {
                    "openstreetmap" : tile_layer_06b4acf14b01955841ffef023754dbfb,
                },
                overlays :  {
                    "OpenSeaMap" : tile_layer_a9496f097e59ffccce821a237c15cf46,
                },
            };
            let layer_control_edfb7d855a0e1b0fe6b3b5dedc2d284a = L.control.layers(
                layer_control_edfb7d855a0e1b0fe6b3b5dedc2d284a_layers.base_layers,
                layer_control_edfb7d855a0e1b0fe6b3b5dedc2d284a_layers.overlays,
                {
  "position": "topright",
  "collapsed": true,
  "autoZIndex": true,
}
            ).addTo(map_e5e73d9d3847174157147452626b1ab7);

        
    
            var markerCount = 0;

            function newMarker(e) {
                markerCount += 1;

                var new_mark = L.marker().setLatLng(e.latlng, { draggable: true }).addTo(map_e5e73d9d3847174157147452626b1ab7);
                new_mark.dragging.enable();

                // Display coordinates in the popup
                function updatePopup(marker) {
                    var lat = marker.getLatLng().lat.toFixed(4);
                    var lng = marker.getLatLng().lng.toFixed(4);
                    marker.bindPopup("Marker: " + markerCount + "<br>Lat: " + lat + "<br>Lng: " + lng).openPopup();
                }

                updatePopup(new_mark); // afficher dès l'ajout

                // Update the pupop when the marker moves
                new_mark.on('dragend', function(e) {
                    updatePopup(e.target);
                });

                // Delete when double click
                new_mark.on('dblclick', function(e) {
                    map_e5e73d9d3847174157147452626b1ab7.removeLayer(e.target);
                    markerCount -= 1;
                    updateMarkerCounter();
                });

                updateMarkerCounter();
            }

            function updateMarkerCounter() {
                var counter = document.getElementById("marker-counter");
                if (counter) {
                    counter.innerText = "Number of markers : " + markerCount;
                }
            }

            map_e5e73d9d3847174157147452626b1ab7.on('click', newMarker);
        
    
            tile_layer_06b4acf14b01955841ffef023754dbfb.addTo(map_e5e73d9d3847174157147452626b1ab7);
        
    
            tile_layer_a9496f097e59ffccce821a237c15cf46.addTo(map_e5e73d9d3847174157147452626b1ab7);
        
</script>
